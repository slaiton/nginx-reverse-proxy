name: Deploy Nginx Reverse Proxy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: /home/forge/nginx-reverse-proxy
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY_PASSPHRASE: ${{ secrets.PROD_SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.PROD_SSH_PORT || 22 }}" -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          askpass=$(mktemp)
          printf '#!/bin/sh\necho "$SSH_KEY_PASSPHRASE"\n' > "$askpass"
          chmod 700 "$askpass"
          SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=: ssh-add ~/.ssh/deploy_key < /dev/null
          rm -f "$askpass" ~/.ssh/deploy_key

      - name: Sync nginx configuration
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Deploy and reload nginx
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && docker compose down && docker compose up -d && docker exec nginx-reverse-proxy nginx -s reload"

      - name: Cleanup SSH
        if: always()
        run: ssh-agent -k || true
