user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/plain text/css text/xml text/javascript application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Resolver DNS
    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Health check endpoint (para verificar que nginx está arriba)
    server {
        listen 8888;
        server_name _;
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # Incluir configuraciones de sitios específicos
    include /etc/nginx/conf.d/*.conf;
}
