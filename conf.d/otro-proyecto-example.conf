# ============================================================================
# Ejemplo 2: Reverse Proxy para otro.dominio.com
# ============================================================================
# Pasos:
#   1. Copiar a otro-proyecto.conf
#   2. Reemplazar otro.dominio.com y puerto 8081
#   3. sudo certbot certonly --standalone -d otro.dominio.com
#   4. docker compose exec nginx nginx -s reload
# ============================================================================

upstream otro_proyecto {
    # Proyecto en puerto 8081 (ajusta según tu docker-compose)
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name otro.dominio.com www.otro.dominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name otro.dominio.com www.otro.dominio.com;

    ssl_certificate /etc/letsencrypt/live/otro.dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otro.dominio.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/otro.dominio.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/otro-proyecto-access.log main;
    error_log /var/log/nginx/otro-proyecto-error.log warn;

    location / {
        proxy_pass http://otro_proyecto;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
