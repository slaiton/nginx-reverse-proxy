# ============================================================================
# Reverse Proxy para api-innvestock.slaiton.com
# ============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api-innvestock.slaiton.com www.api-innvestock.slaiton.com;

    # Allow Certbot validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }

    location /docs/ {
        return 301 /api/docs$request_uri;
    }
}

# HTTPS upstream
upstream logistica_api {
    server host.docker.internal:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-innvestock.slaiton.com www.api-innvestock.slaiton.com;

    # ========================================================================
    # Certificados SSL (desde Certbot en /etc/letsencrypt)
    # ========================================================================
    # Usar ruta que intenta primero la nombrada, luego fallback a -0001 (certbot versioning)
    ssl_certificate /etc/letsencrypt/live/api-innvestock.slaiton.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-innvestock.slaiton.com-0001/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api-innvestock.slaiton.com-0001/chain.pem;

    # ========================================================================
    # Configuración SSL segura (A+ en ssllabs.com)
    # ========================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ========================================================================
    # Seguridad de headers
    # ========================================================================
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ========================================================================
    # Logging
    # ========================================================================
    access_log /var/log/nginx/api-innvestock-access.log main;
    error_log /var/log/nginx/api-innvestock-error.log warn;

    # ========================================================================
    # Proxy a Docker (logistica_api en puerto 8080)
    # ========================================================================
    location / {
        proxy_pass http://logistica_api;
        proxy_http_version 1.1;

        # Headers necesarios para que Laravel sepa que está detrás de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # Conexión persistente
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Deny acceso a archivos sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Redirect www a no-www (opcional)
