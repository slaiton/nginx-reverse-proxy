# ============================================================================
# Reverse Proxy para api-innvestock.slaiton.com (HTTP ONLY - TEMPORAL)
# Usado hasta que los certificados SSL sean generados por certbot
# ============================================================================

upstream logistica_api {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-innvestock.slaiton.com www.api-innvestock.slaiton.com;

    # ========================================================================
    # Logging
    # ========================================================================
    access_log /var/log/nginx/api-innvestock-access.log main;
    error_log /var/log/nginx/api-innvestock-error.log warn;

    # Allow Certbot validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ========================================================================
    # Proxy a Docker (logistica_api en puerto 8080)
    # ========================================================================
    location / {
        proxy_pass http://logistica_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Deny acceso a archivos sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
